name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environnement:
        description: Environnement cible
        required: true
        default: production
        type: choice
        options: [staging, production]

# Un seul déploiement à la fois, et on ne l'interrompt PAS en cours de route :
# une synchronisation S3 coupée au milieu laisse le site à moitié à jour.
concurrency:
  group: deploy-${{ inputs.environnement || 'production' }}
  cancel-in-progress: false

# ── CONSTANTES DU DEPLOIEMENT ────────────────────────────────────────────
#
# Elles etaient des variables GitHub. Une region et un nom de domaine ne sont
# pourtant ni l'un ni l'autre des secrets : les mettre ici les rend versionnes,
# relisibles dans une revue, et modifiables par une pull request plutot que par
# un formulaire que personne ne relit. On ne garde en secret que ce qui en est
# vraiment un : les identifiants et les cles.
env:
  REGION_AWS: eu-west-3
  DOMAINE_PLATEFORME: nexacode.store

jobs:
  deploy:
    name: Publier sur AWS
    runs-on: ubuntu-latest
    environment: ${{ inputs.environnement || 'production' }}


    permissions:
      id-token: write # indispensable : c'est le jeton OIDC présenté à AWS
      contents: read

    steps:
      # ── Y A-T-IL DE QUOI DEPLOYER ? ─────────────────────────────────────
      #
      # Remplace l'ancienne variable DEPLOY_ENABLED. Le principe est le meme —
      # ne pas afficher un echec rouge tant que l'infrastructure n'existe pas —
      # mais il n'y a plus rien a configurer : la presence des secrets DIT deja
      # si le deploiement est possible. Un reglage de moins a tenir a jour, et
      # un de moins a oublier.
      #
      # GitHub interdit le contexte `secrets` dans un `if` de job : c'est
      # pourquoi ce controle est une ETAPE, et non une condition de job.
      - name: Verifier la configuration
        id: pret
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
          SEAU: ${{ secrets.S3_BUCKET }}
        run: |
          set -euo pipefail
          if [ -n "${ROLE:-}" ] && [ -n "${SEAU:-}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Configuration presente : le deploiement peut avoir lieu."
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploiement ignore : il manque AWS_ROLE_ARN et/ou S3_BUCKET."
            echo "Les poser dans Settings > Secrets and variables > Actions > Secrets."
          fi

      - uses: actions/checkout@v4
        if: steps.pret.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.pret.outputs.ok == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        if: steps.pret.outputs.ok == 'true'
        run: npm ci

      - name: Compiler
        if: steps.pret.outputs.ok == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PLATFORM_DOMAIN: ${{ env.DOMAINE_PLATEFORME }}
        run: npm run build

      # Aucune clé AWS n'est stockée : GitHub présente un jeton OIDC de courte
      # durée, AWS le vérifie et renvoie des identifiants temporaires.
      - name: S'authentifier auprès d'AWS
        if: steps.pret.outputs.ok == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.REGION_AWS }}

      # ---------------------------------------------------------------------
      # Publication, en quatre passes. L'ordre et la séparation ne sont pas
      # cosmétiques : chaque famille de fichiers a sa durée de cache et son type.
      # ---------------------------------------------------------------------
      - name: Publier les fichiers immuables
        if: steps.pret.outputs.ok == 'true'
        run: |
          # Les noms contiennent un hachage : le contenu ne changera jamais.
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET }}/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "sw.js" \
            --exclude "manifest.webmanifest" \
            --exclude "*.glb" \
            --exclude "*.usdz"

      - name: Publier les modèles 3D avec le bon type MIME
        if: steps.pret.outputs.ok == 'true'
        run: |
          # S3 étiquette par défaut binary/octet-stream. Le navigateur s'en
          # accommode, mais Scene Viewer (Android) et Quick Look (iOS) refusent
          # le fichier : la 3D s'affiche et la réalité augmentée échoue en silence.
          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET }}/" \
            --exclude "*" --include "*.glb" \
            --content-type "model/gltf-binary" \
            --cache-control "public,max-age=604800"

          aws s3 sync dist/ "s3://${{ secrets.S3_BUCKET }}/" \
            --exclude "*" --include "*.usdz" \
            --content-type "model/vnd.usdz+zip" \
            --cache-control "public,max-age=604800"

      - name: Publier les fichiers jamais mis en cache
        if: steps.pret.outputs.ok == 'true'
        run: |
          # index.html porte les références aux bundles hachés, et sw.js décide
          # de ce que voient les visiteurs déjà venus. Mis en cache, l'un ou
          # l'autre fige le site sur la version précédente.
          aws s3 cp dist/index.html "s3://${{ secrets.S3_BUCKET }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

          aws s3 cp dist/sw.js "s3://${{ secrets.S3_BUCKET }}/sw.js" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "application/javascript; charset=utf-8"

          aws s3 cp dist/manifest.webmanifest "s3://${{ secrets.S3_BUCKET }}/manifest.webmanifest" \
            --cache-control "public,max-age=3600" \
            --content-type "application/manifest+json"

      - name: Purger le cache CloudFront
        if: steps.pret.outputs.ok == 'true'
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/index.html" "/sw.js" "/manifest.webmanifest" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $ID en cours…"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$ID"
          echo "Cache purgé."

      # Vérification a posteriori : on contrôle ce que le visiteur reçoit
      # vraiment, pas ce qu'on croit avoir déployé.
      - name: Vérifier le site en ligne
        if: steps.pret.outputs.ok == 'true'
        run: |
          set -e
          BASE="https://${{ env.DOMAINE_PLATEFORME }}"

          echo "── Page d'accueil ──"
          curl -fsS -o /dev/null -w "%{http_code}\n" "$BASE/" | grep -q 200

          # LE contrôle qui compte : un lien profond doit répondre 200, pas 403.
          # C'est le repli SPA, et c'est de lui que dépendent les QR codes de
          # réalité augmentée, qui pointent vers /site/ar/<id>.
          echo "── Repli SPA sur lien profond ──"
          CODE=$(curl -fsS -o /dev/null -w "%{http_code}" "$BASE/site/ar/demo")
          [ "$CODE" = "200" ] || { echo "Repli SPA cassé : $CODE"; exit 1; }

          echo "── Type MIME du modèle 3D ──"
          TYPE=$(curl -fsSI "$BASE/modeles/tabouret.glb" | tr -d '\r' \
                 | awk -F': ' 'tolower($1)=="content-type"{print $2}')
          echo "content-type = $TYPE"
          [ "$TYPE" = "model/gltf-binary" ] \
            || { echo "Type MIME incorrect : la RA échouera sur Android et iOS"; exit 1; }

          echo "Déploiement vérifié."

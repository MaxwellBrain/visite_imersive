name: Conteneur
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployer:
        description: Deployer apres publication
        type: boolean
        default: true

concurrency:
  # On n'interrompt PAS un déploiement en cours : une bascule ECS coupée au
  # milieu laisse le service à moitié à jour.
  group: conteneur-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ── CONSTANTES ───────────────────────────────────────────────────────────
#
# Aucune n'est un secret : un nom d'image et un domaine public n'ont rien a
# faire dans un coffre. Ici, ils sont versionnes et relisibles en revue.
env:
  # LES DEUX REGISTRES NE PORTENT PAS LE MEME NOM, et c est frequent : on ne
  # choisit pas toujours le nom de son depot au meme moment ni au meme endroit.
  # On les ecrit donc tous les deux, en entier, plutot que de deduire l un de
  # l autre : la deduction commode aurait pousse vers « maxkamgang/nexacode »,
  # un depot qui n existe pas.
  DEPOT_DOCKERHUB: maxkamgang/musea
  DOMAINE_PLATEFORME: nexacode.store

  # ECR — les valeurs viennent de la console AWS, telles qu'elle les affiche.
  #
  # ATTENTION A LA REGION : ce depot est en us-east-2 (Ohio), alors que la
  # pile Terraform de infra-conteneurs/ vit en eu-west-3. Les deux coexistent,
  # et confondre l'une avec l'autre donne un « repository does not exist »
  # parfaitement opaque. C'est pourquoi la region est ecrite ici, une fois.
  REGION_ECR: us-east-2
  REGISTRE_ECR: 492562025058.dkr.ecr.us-east-2.amazonaws.com
  DEPOT_ECR: nexacode

permissions:
  contents: read

jobs:
  # ==========================================================================
  # 1. VÉRIFIER — construire l'image et l'interroger pour de vrai
  # --------------------------------------------------------------------------
  # Aucun accès AWS. Ce travail tourne sur les pull requests, y compris depuis
  # une bifurcation, et c'est le seul filet avant publication.
  # ==========================================================================
  verifier:
    name: Construire et eprouver l'image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          # `load` place l'image dans le démon Docker local : c'est ce qui
          # permet de la LANCER juste après. Impossible avec plusieurs
          # architectures — d'où amd64 seul ici, le multi-architecture étant
          # réservé à la publication.
          load: true
          tags: musea:verification
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_PLATFORM_DOMAIN=${{ env.DOMAINE_PLATEFORME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------
      # On ne se contente pas de constater que l'image se construit : on la
      # démarre et on lui pose les questions qui, en production, cassent en
      # silence.
      # ------------------------------------------------------------------
      - name: Demarrer le conteneur
        run: |
          docker run -d --name musea-test -p 8080:8080 musea:verification
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/sante >/dev/null 2>&1; then
              echo "conteneur pret apres ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Le conteneur n'a jamais repondu :"
          docker logs musea-test
          exit 1

      - name: Eprouver le comportement de production
        run: |
          set -e
          BASE=http://127.0.0.1:8080

          echo "-- sonde de sante --"
          test "$(curl -fsS $BASE/sante)" = "ok"

          echo "-- page d'accueil --"
          curl -fsS -o /dev/null -w '%{http_code}\n' $BASE/ | grep -q 200

          echo "-- repli SPA sur lien profond --"
          # LE controle qui compte : les QR codes de realite augmentee pointent
          # vers /site/ar/<id>, un chemin qui n'existe pas sur le disque.
          CODE=$(curl -fsS -o /dev/null -w '%{http_code}' $BASE/site/ar/demo)
          test "$CODE" = "200" || { echo "Repli SPA casse : $CODE"; exit 1; }

          echo "-- type MIME du modele 3D --"
          # binary/octet-stream fait echouer Scene Viewer sur Android et Quick
          # Look sur iOS, sans le moindre message d'erreur.
          TYPE=$(curl -fsSI $BASE/modeles/tabouret.glb | tr -d '\r' \
                 | awk -F': ' 'tolower($1)=="content-type"{print $2}')
          echo "content-type = $TYPE"
          test "$TYPE" = "model/gltf-binary" \
            || { echo "Type MIME incorrect : la RA echouera sur mobile"; exit 1; }

          echo "-- en-tetes de securite --"
          curl -fsSI $BASE/ | grep -qi 'x-content-type-options: nosniff'
          curl -fsSI $BASE/ | grep -qi 'strict-transport-security'

          echo "-- le conteneur ne tourne pas en root --"
          test "$(docker exec musea-test id -u)" != "0"

          echo "Image conforme."

      - name: Eprouver le portail d'acces du staging
        run: |
          set -e
          # Le meme conteneur, avec la variable d environnement fournie en
          # staging : la page d'accueil doit se fermer, la sonde rester ouverte.
          docker run -d --name musea-auth -p 8081:8080 \
            -e MUSEA_BASIC_AUTH='jury:soutenance' musea:verification
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8081/sante >/dev/null 2>&1 && break
            sleep 1
          done

          echo "-- la sonde reste publique --"
          test "$(curl -fsS http://127.0.0.1:8081/sante)" = "ok"

          echo "-- la page d'accueil est fermee --"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/)
          test "$CODE" = "401" || { echo "Portail inactif : $CODE"; exit 1; }

          echo "-- et s'ouvre avec le bon mot de passe --"
          CODE=$(curl -s -u jury:soutenance -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/)
          test "$CODE" = "200" || { echo "Portail infranchissable : $CODE"; exit 1; }

          docker rm -f musea-auth

      # v0.36.0 et non v0.28.0 : cette derniere appelait `setup-trivy@v0.2.1`
      # par TAG, et ce tag a ete supprime en amont — l'action est devenue
      # irreparable, elle echouait au « Set up job » avant tout telechargement.
      # Les versions recentes epinglent leur dependance par SHA, qui ne peut pas
      # disparaitre. C'est la raison de fond de monter, pas la nouveaute.
      - name: Analyser les vulnerabilites
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: musea:verification
          format: table
          # On signale sans bloquer : une image nginx a presque toujours une
          # alerte ouverte dont le correctif n'existe pas encore en amont.
          # Bloquer ici reviendrait a ne plus pouvoir deployer du tout.
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Produire la nomenclature logicielle (SBOM)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: musea:verification
          format: cyclonedx
          output: sbom.cyclonedx.json

      - name: Conserver la nomenclature
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 30

      - name: Journaux du conteneur en cas d'echec
        if: failure()
        run: docker logs musea-test || true

  # ==========================================================================
  # 2. PUBLIER — Docker Hub, et rien d autre
  # ==========================================================================
  publier:
    name: Publier l'image
    runs-on: ubuntu-latest
    needs: verifier
    # Plus d'interrupteur a configurer : on publie des qu'on n'est pas sur une
    # pull request. Si aucun registre n'est configure, l'etape « Choisir les
    # registres » le constate et saute la construction — le job finit vert,
    # sans avoir rien fabrique pour rien.
    if: github.event_name != 'pull_request'

    # Plus de « id-token: write » : ce jeton ne servait qu a se presenter a
    # AWS par OIDC. Sans AWS, le demander serait un privilege gratuit.
    permissions:
      contents: read
      

    outputs:
      etiquette: ${{ steps.metadonnees.outputs.version }}
      empreinte: ${{ steps.construire.outputs.digest }}
      image: ${{ steps.registre.outputs.depot }}

    steps:
      - uses: actions/checkout@v4
      # ── OU PUBLIER, ET AVEC QUELLE CONFIGURATION ────────────────────────
      #
      # Docker Hub, et rien d autre. Le depot se deduit du compte :
      # « moncompte » + « musea » donnent « moncompte/musea ». C est la
      # convention de Docker Hub, et cela evite un reglage de plus.
      #
      # Sans identifiants, on ne rougit pas : on saute la construction avec
      # une note. Rougir a chaque push sur un depot pas encore configure,
      # c'est apprendre a ne plus regarder les echecs.
      - name: Preparer la publication
        id: registre
        env:
          UTILISATEUR: ${{ secrets.DOCKERHUB_USERNAME }}
          JETON: ${{ secrets.DOCKERHUB_TOKEN }}
          CLE_AWS: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_AWS: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          URL_SUPABASE: ${{ secrets.VITE_SUPABASE_URL }}
          CLE_SUPABASE: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          # DEUX REGISTRES, INDEPENDANTS. Chacun s allume si ses identifiants
          # sont la. On peut donc publier sur ECR seul, sur Docker Hub seul, ou
          # sur les deux — sans jamais rien changer au fichier.
          CIBLES=""

          if [ -n "${CLE_AWS:-}" ] && [ -n "${SECRET_AWS:-}" ]; then
            echo "ecr=true" >> "$GITHUB_OUTPUT"
            CIBLES="${REGISTRE_ECR}/${DEPOT_ECR}"
            echo "ECR : ${REGISTRE_ECR}/${DEPOT_ECR}"
          else
            echo "ecr=false" >> "$GITHUB_OUTPUT"
            echo "ECR ignore : AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY absents."
          fi

          if [ -n "${UTILISATEUR:-}" ] && [ -n "${JETON:-}" ]; then
            echo "hub=true" >> "$GITHUB_OUTPUT"
            # printf plutot qu un retour a la ligne litteral : une ligne qui
            # commence en colonne 0 fermerait le bloc « run: | » et casserait
            # le YAML. La faute ne se voit qu au moment ou GitHub refuse le
            # fichier, sans dire pourquoi.
            if [ -n "$CIBLES" ]; then
              CIBLES=$(printf '%s\n%s' "$CIBLES" "$DEPOT_DOCKERHUB")
            else
              CIBLES="$DEPOT_DOCKERHUB"
            fi
            echo "Docker Hub : $DEPOT_DOCKERHUB"
          else
            echo "hub=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub ignore : DOCKERHUB_USERNAME / DOCKERHUB_TOKEN absents."
          fi

          if [ -z "$CIBLES" ]; then
            echo "publier=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aucun registre configure : rien a publier."
            exit 0
          fi

          echo "publier=true" >> "$GITHUB_OUTPUT"
          # La premiere cible sert de nom court dans le recapitulatif.
          echo "depot=$(printf '%s' "$CIBLES" | head -n 1)" >> "$GITHUB_OUTPUT"

          # Sortie multiligne : le delimiteur est obligatoire, GitHub refuse
          # un retour a la ligne dans la forme « cle=valeur ».
          {
            echo 'cibles<<FIN_DES_CIBLES'
            echo "$CIBLES"
            echo 'FIN_DES_CIBLES'
          } >> "$GITHUB_OUTPUT"

          # Une image compilee sans adresse Supabase produit un site qui
          # s affiche et ne charge aucune donnee : la panne la plus
          # deroutante qui soit. On refuse plutot que de la livrer.
          if [ -z "${URL_SUPABASE:-}" ] || [ -z "${CLE_SUPABASE:-}" ]; then
            echo "::error::VITE_SUPABASE_URL et VITE_SUPABASE_ANON_KEY sont requis."
            exit 1
          fi

          # Masquage AVANT toute ecriture : sans ces directives, un « set -x »
          # afficherait la cle en clair dans des journaux publics.
          echo "::add-mask::$URL_SUPABASE"
          echo "::add-mask::$CLE_SUPABASE"
          {
            echo "VITE_SUPABASE_URL=$URL_SUPABASE"
            echo "VITE_SUPABASE_ANON_KEY=$CLE_SUPABASE"
            echo "VITE_PLATFORM_DOMAIN=$DOMAINE_PLATEFORME"
          } >> "$GITHUB_ENV"

      
      - name: Se connecter a ECR
        if: steps.registre.outputs.publier == 'true' && steps.registre.outputs.ecr == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$REGION_ECR" \
            | docker login --username AWS --password-stdin "$REGISTRE_ECR"

      # docker login, par l action officielle : elle masque le jeton dans
      # les journaux et ecrit le magasin d identifiants comme il faut. La
      # commande nue laisserait le mot de passe visible dans la table des
      # processus du runner.
      - name: Se connecter a Docker Hub
        if: steps.registre.outputs.publier == 'true' && steps.registre.outputs.hub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          

      # Calcule les etiquettes a partir de la reference git. C'est ici que
      # « pousser une etiquette v1.2.3 » devient « publier une version ».
      - name: Calculer les etiquettes
        if: steps.registre.outputs.publier == 'true'
        id: metadonnees
        uses: docker/metadata-action@v5
        with:
          # Les deux registres a la fois : docker/metadata-action produit une
          # etiquette par registre et par variante, et build-push-action pousse
          # tout d une seule construction. L image n'est fabriquee qu'une fois.
          images: ${{ steps.registre.outputs.cibles }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=MUSEA
            org.opencontainers.image.description=Plateforme de visite immersive de la Fondation Jean Felicien Gacha
            org.opencontainers.image.vendor=Fondation Jean Felicien Gacha

      - uses: docker/setup-qemu-action@v3
        if: steps.registre.outputs.publier == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.registre.outputs.publier == 'true'

      - name: Construire et publier
        if: steps.registre.outputs.publier == 'true'
        id: construire
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Deux architectures depuis une seule construction : l'etage de
          # compilation tourne en natif (voir --platform=$BUILDPLATFORM dans le
          # Dockerfile), seul l'etage de diffusion est duplique. arm64 ouvre
          # Fargate Graviton et ses ~20 % d'economie.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadonnees.outputs.tags }}
          labels: ${{ steps.metadonnees.outputs.labels }}
          build-args: |
            VITE_SUPABASE_URL=${{ env.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ env.VITE_SUPABASE_ANON_KEY }}
            VITE_PLATFORM_DOMAIN=${{ env.VITE_PLATFORM_DOMAIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations desactivees a dessein : elles ajoutent au manifeste des
          # entrees « unknown/unknown » que certains outils de deploiement lisent
          # mal. La nomenclature logicielle est produite separement, en artefact
          # de CI — meme information, sans risque sur le tirage de l'image.
          provenance: false

      - name: Recapituler
        if: steps.registre.outputs.publier == 'true'
        run: |
          {
            echo "### Image publiee"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ steps.metadonnees.outputs.version }}\` |"
            echo "| Empreinte | \`${{ steps.construire.outputs.digest }}\` |"
            echo "| Architectures | linux/amd64, linux/arm64 |"
            echo
            echo "Etiquettes :"
            echo '```'
            echo "${{ steps.metadonnees.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
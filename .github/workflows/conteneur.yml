name: Conteneur

# ============================================================================
# Chaîne conteneur : construire → vérifier → publier → déployer
# ----------------------------------------------------------------------------
# Ce workflow est INDÉPENDANT de ci.yml et deploy.yml. Ceux-ci continuent de
# publier le site statique sur S3 + CloudFront, exactement comme avant. Rien
# ici ne les touche, ne les remplace, ni ne partage leurs secrets.
#
# Ce qui déclenche quoi :
#
#   Pull request     → `verifier` seul. On construit l'image et on l'INTERROGE
#                      réellement : repli SPA, types MIME, sonde de santé. Rien
#                      n'est publié, aucun accès AWS n'est demandé.
#   Push sur main    → publication de l'image (étiquettes `main-<sha>` et
#                      `latest`), puis déploiement.
#   Étiquette v1.2.3 → publication d'une VERSION (`v1.2.3`, `1.2`, `1`), puis
#                      déploiement. C'est le geste qui fait une release.
#
# INTERRUPTEUR : tant que la variable de dépôt CONTENEUR_DEPLOY_ENABLED n'est
# pas posée à « true », rien n'est publié ni déployé. Sans ce garde-fou, chaque
# push afficherait un échec rouge sans rapport avec le code — et l'on finit par
# ne plus regarder les échecs du tout.
# ============================================================================

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployer:
        description: Deployer apres publication
        type: boolean
        default: true

concurrency:
  # On n'interrompt PAS un déploiement en cours : une bascule ECS coupée au
  # milieu laisse le service à moitié à jour.
  group: conteneur-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ==========================================================================
  # 1. VÉRIFIER — construire l'image et l'interroger pour de vrai
  # --------------------------------------------------------------------------
  # Aucun accès AWS. Ce travail tourne sur les pull requests, y compris depuis
  # une bifurcation, et c'est le seul filet avant publication.
  # ==========================================================================
  verifier:
    name: Construire et eprouver l'image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construire l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          # `load` place l'image dans le démon Docker local : c'est ce qui
          # permet de la LANCER juste après. Impossible avec plusieurs
          # architectures — d'où amd64 seul ici, le multi-architecture étant
          # réservé à la publication.
          load: true
          tags: musea:verification
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_PLATFORM_DOMAIN=${{ vars.PLATFORM_DOMAIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------
      # On ne se contente pas de constater que l'image se construit : on la
      # démarre et on lui pose les questions qui, en production, cassent en
      # silence.
      # ------------------------------------------------------------------
      - name: Demarrer le conteneur
        run: |
          docker run -d --name musea-test -p 8080:8080 musea:verification
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/sante >/dev/null 2>&1; then
              echo "conteneur pret apres ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Le conteneur n'a jamais repondu :"
          docker logs musea-test
          exit 1

      - name: Eprouver le comportement de production
        run: |
          set -e
          BASE=http://127.0.0.1:8080

          echo "-- sonde de sante --"
          test "$(curl -fsS $BASE/sante)" = "ok"

          echo "-- page d'accueil --"
          curl -fsS -o /dev/null -w '%{http_code}\n' $BASE/ | grep -q 200

          echo "-- repli SPA sur lien profond --"
          # LE controle qui compte : les QR codes de realite augmentee pointent
          # vers /site/ar/<id>, un chemin qui n'existe pas sur le disque.
          CODE=$(curl -fsS -o /dev/null -w '%{http_code}' $BASE/site/ar/demo)
          test "$CODE" = "200" || { echo "Repli SPA casse : $CODE"; exit 1; }

          echo "-- type MIME du modele 3D --"
          # binary/octet-stream fait echouer Scene Viewer sur Android et Quick
          # Look sur iOS, sans le moindre message d'erreur.
          TYPE=$(curl -fsSI $BASE/modeles/tabouret.glb | tr -d '\r' \
                 | awk -F': ' 'tolower($1)=="content-type"{print $2}')
          echo "content-type = $TYPE"
          test "$TYPE" = "model/gltf-binary" \
            || { echo "Type MIME incorrect : la RA echouera sur mobile"; exit 1; }

          echo "-- en-tetes de securite --"
          curl -fsSI $BASE/ | grep -qi 'x-content-type-options: nosniff'
          curl -fsSI $BASE/ | grep -qi 'strict-transport-security'

          echo "-- le conteneur ne tourne pas en root --"
          test "$(docker exec musea-test id -u)" != "0"

          echo "Image conforme."

      - name: Eprouver le portail d'acces du staging
        run: |
          set -e
          # Le meme conteneur, avec la variable injectee par Secrets Manager en
          # staging : la page d'accueil doit se fermer, la sonde rester ouverte.
          docker run -d --name musea-auth -p 8081:8080 \
            -e MUSEA_BASIC_AUTH='jury:soutenance' musea:verification
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8081/sante >/dev/null 2>&1 && break
            sleep 1
          done

          echo "-- la sonde reste publique --"
          test "$(curl -fsS http://127.0.0.1:8081/sante)" = "ok"

          echo "-- la page d'accueil est fermee --"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/)
          test "$CODE" = "401" || { echo "Portail inactif : $CODE"; exit 1; }

          echo "-- et s'ouvre avec le bon mot de passe --"
          CODE=$(curl -s -u jury:soutenance -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/)
          test "$CODE" = "200" || { echo "Portail infranchissable : $CODE"; exit 1; }

          docker rm -f musea-auth

      - name: Analyser les vulnerabilites
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: musea:verification
          format: table
          # On signale sans bloquer : une image nginx a presque toujours une
          # alerte ouverte dont le correctif n'existe pas encore en amont.
          # Bloquer ici reviendrait a ne plus pouvoir deployer du tout.
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Produire la nomenclature logicielle (SBOM)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: musea:verification
          format: cyclonedx
          output: sbom.cyclonedx.json

      - name: Conserver la nomenclature
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 30

      - name: Journaux du conteneur en cas d'echec
        if: failure()
        run: docker logs musea-test || true

  # ==========================================================================
  # 2. PUBLIER — ECR (pour deployer) et Docker Hub (pour etre verifiable)
  # ==========================================================================
  publier:
    name: Publier l'image
    runs-on: ubuntu-latest
    needs: verifier
    if: github.event_name != 'pull_request' && vars.CONTENEUR_DEPLOY_ENABLED == 'true'

    permissions:
      id-token: write # le jeton OIDC presente a AWS
      contents: read

    outputs:
      etiquette: ${{ steps.metadonnees.outputs.version }}
      empreinte: ${{ steps.construire.outputs.digest }}
      image_ecr: ${{ steps.cibles.outputs.ecr }}

    steps:
      - uses: actions/checkout@v4

      # Aucune cle AWS n'est stockee : GitHub presente un jeton OIDC de courte
      # duree, AWS le verifie et rend des identifiants temporaires. Le role est
      # verrouille sur CE depot (voir infra-conteneurs/oidc.tf).
      - name: S'authentifier aupres d'AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_CONTENEURS }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-3' }}

      - name: Se connecter a ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # La configuration de compilation vient de Secrets Manager, pas des
      # secrets GitHub : une seule source de verite, celle que lisent aussi les
      # taches. C'est ce qui evite qu'une valeur change d'un cote et pas de
      # l'autre. Repli sur les secrets GitHub si le secret n'existe pas encore.
      - name: Lire la configuration depuis Secrets Manager
        # Les valeurs passent par `env:` et jamais par une interpolation `${{ }}`
        # au milieu du script : une valeur contenant un guillemet ou un
        # point-virgule serait sinon interpretee comme du shell. C'est la faille
        # d'injection classique des workflows GitHub.
        env:
          NOM_SECRET: ${{ vars.SECRET_APPLICATION }}
          REPLI_URL: ${{ secrets.VITE_SUPABASE_URL }}
          REPLI_CLE: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          REPLI_DOMAINE: ${{ vars.PLATFORM_DOMAIN }}
        run: |
          set -euo pipefail
          URL=''; CLE=''; DOM=''

          if [ -n "${NOM_SECRET:-}" ]; then
            if VALEURS=$(aws secretsmanager get-secret-value \
                  --secret-id "$NOM_SECRET" --query SecretString --output text 2>/dev/null); then
              echo "Configuration lue depuis Secrets Manager : $NOM_SECRET"
              URL=$(printf '%s' "$VALEURS" | jq -r '.vite_supabase_url // empty')
              CLE=$(printf '%s' "$VALEURS" | jq -r '.vite_supabase_anon_key // empty')
              DOM=$(printf '%s' "$VALEURS" | jq -r '.vite_platform_domain // empty')
            else
              echo "::warning::Secret $NOM_SECRET illisible : repli sur les secrets GitHub."
            fi
          fi

          # Repli explicite, valeur par valeur : un secret partiellement rempli
          # ne doit pas produire une compilation partiellement configuree.
          [ -n "$URL" ] || URL="${REPLI_URL:-}"
          [ -n "$CLE" ] || CLE="${REPLI_CLE:-}"
          [ -n "$DOM" ] || DOM="${REPLI_DOMAINE:-}"

          # Masquage AVANT toute ecriture : sans ces directives, un `set -x`
          # malencontreux afficherait la cle en clair dans les journaux publics.
          [ -n "$URL" ] && echo "::add-mask::$URL"
          [ -n "$CLE" ] && echo "::add-mask::$CLE"

          # Une compilation sans adresse Supabase produit un site qui s'affiche
          # et ne charge aucune donnee — la panne la plus deroutante qui soit.
          if [ -z "$URL" ] || [ -z "$CLE" ]; then
            echo "Ni Secrets Manager ni les secrets GitHub ne fournissent la configuration Supabase."
            exit 1
          fi

          {
            echo "VITE_SUPABASE_URL=$URL"
            echo "VITE_SUPABASE_ANON_KEY=$CLE"
            echo "VITE_PLATFORM_DOMAIN=$DOM"
          } >> "$GITHUB_ENV"

      - name: Determiner les registres cibles
        id: cibles
        env:
          REGISTRE_ECR: ${{ steps.ecr.outputs.registry }}
          NOM_DEPOT: ${{ vars.ECR_REPOSITORY_NAME }}
          DEPOT_HUB: ${{ vars.DOCKERHUB_REPOSITORY }}
          UTILISATEUR_HUB: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          ECR="${REGISTRE_ECR}/${NOM_DEPOT:-musea}"
          echo "ecr=$ECR" >> "$GITHUB_OUTPUT"

          # Docker Hub est facultatif : sans depot ET sans identifiants, on
          # publie sur ECR seul et le workflow continue. Une vitrine absente
          # n'est pas une panne — mais un deploiement rate, si.
          if [ -n "${DEPOT_HUB:-}" ] && [ -n "${UTILISATEUR_HUB:-}" ]; then
            echo "Registres : ECR + Docker Hub ($DEPOT_HUB)"
            echo "hub=$DEPOT_HUB" >> "$GITHUB_OUTPUT"
            LISTE="$ECR"$'\n'"$DEPOT_HUB"
          else
            echo "Docker Hub non configure : publication sur ECR uniquement."
            echo "hub=" >> "$GITHUB_OUTPUT"
            LISTE="$ECR"
          fi

          # Sortie multiligne : le delimiteur est obligatoire, GitHub refuse
          # un retour a la ligne dans la forme « cle=valeur ».
          {
            echo 'images<<FIN_DES_IMAGES'
            echo "$LISTE"
            echo 'FIN_DES_IMAGES'
          } >> "$GITHUB_OUTPUT"

      - name: Se connecter a Docker Hub
        if: steps.cibles.outputs.hub != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Calcule les etiquettes a partir de la reference git. C'est ici que
      # « pousser une etiquette v1.2.3 » devient « publier une version ».
      - name: Calculer les etiquettes
        id: metadonnees
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.cibles.outputs.images }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=MUSEA
            org.opencontainers.image.description=Plateforme de visite immersive de la Fondation Jean Felicien Gacha
            org.opencontainers.image.vendor=Fondation Jean Felicien Gacha

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Construire et publier
        id: construire
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Deux architectures depuis une seule construction : l'etage de
          # compilation tourne en natif (voir --platform=$BUILDPLATFORM dans le
          # Dockerfile), seul l'etage de diffusion est duplique. arm64 ouvre
          # Fargate Graviton et ses ~20 % d'economie.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadonnees.outputs.tags }}
          labels: ${{ steps.metadonnees.outputs.labels }}
          build-args: |
            VITE_SUPABASE_URL=${{ env.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ env.VITE_SUPABASE_ANON_KEY }}
            VITE_PLATFORM_DOMAIN=${{ env.VITE_PLATFORM_DOMAIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attestations desactivees a dessein : elles ajoutent au manifeste des
          # entrees « unknown/unknown » que certains outils de deploiement lisent
          # mal. La nomenclature logicielle est produite separement, en artefact
          # de CI — meme information, sans risque sur le tirage de l'image.
          provenance: false

      - name: Recapituler
        run: |
          {
            echo "### Image publiee"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ steps.metadonnees.outputs.version }}\` |"
            echo "| Empreinte | \`${{ steps.construire.outputs.digest }}\` |"
            echo "| Architectures | linux/amd64, linux/arm64 |"
            echo
            echo "Etiquettes :"
            echo '```'
            echo "${{ steps.metadonnees.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # 3. DÉPLOYER SUR ECS — bascule progressive, avec retour arriere automatique
  # ==========================================================================
  deployer_ecs:
    name: Deployer sur ECS Fargate
    runs-on: ubuntu-latest
    needs: publier
    if: vars.ECS_SERVICE != '' && (github.event_name != 'workflow_dispatch' || inputs.deployer)

    environment:
      name: conteneurs
      url: https://${{ vars.CONTENEUR_DOMAINE }}

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: S'authentifier aupres d'AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_CONTENEURS }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-3' }}

      # On deploie par EMPREINTE, pas par etiquette. Une etiquette peut etre
      # repointee ; une empreinte designe un contenu et un seul. C'est ce qui
      # rend le deploiement reproductible et l'incident diagnosticable.
      - name: Preparer la nouvelle definition de tache
        id: definition
        run: |
          set -euo pipefail
          IMAGE='${{ needs.publier.outputs.image_ecr }}@${{ needs.publier.outputs.empreinte }}'
          echo "Image visee : $IMAGE"

          aws ecs describe-task-definition \
            --task-definition '${{ vars.ECS_TASK_FAMILY }}' \
            --query taskDefinition > actuelle.json

          # `describe` rend des champs que `register` refuse : ils decrivent la
          # revision existante, pas la definition. Les laisser provoque un
          # « InvalidParameterException » deroutant.
          jq --arg image "$IMAGE" '
            .containerDefinitions = ([.containerDefinitions[]
              | if .name == "musea" then .image = $image else . end])
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' actuelle.json > nouvelle.json

          ARN=$(aws ecs register-task-definition \
                  --cli-input-json file://nouvelle.json \
                  --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Revision enregistree : $ARN"
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Basculer le service
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster '${{ vars.ECS_CLUSTER }}' \
            --service '${{ vars.ECS_SERVICE }}' \
            --task-definition '${{ steps.definition.outputs.arn }}' \
            --query 'service.deployments[0].{statut:rolloutState,taches:desiredCount}' \
            --output table

          echo "Attente de la stabilisation du service..."
          # Le disjoncteur de deploiement (deployment_circuit_breaker, voir
          # ecs.tf) surveille en parallele : si les nouvelles taches ne
          # deviennent pas saines, ECS remet la version precedente tout seul et
          # cette attente echoue. Le site, lui, ne tombe pas.
          aws ecs wait services-stable \
            --cluster '${{ vars.ECS_CLUSTER }}' \
            --service '${{ vars.ECS_SERVICE }}'
          echo "Service stable."

      # Verification a posteriori : on controle ce que le visiteur recoit
      # vraiment, pas ce qu'on croit avoir deploye.
      - name: Verifier le service en ligne
        run: |
          set -e
          BASE="https://${{ vars.CONTENEUR_DOMAINE }}"

          echo "-- sonde de sante --"
          test "$(curl -fsS --retry 5 --retry-delay 3 $BASE/sante)" = "ok"

          echo "-- page d'accueil --"
          # 401 est acceptable : c'est le portail du staging, pas une panne.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' $BASE/)
          case "$CODE" in
            200|401) echo "accueil : $CODE" ;;
            *) echo "accueil inattendu : $CODE"; exit 1 ;;
          esac

          echo "-- redirection HTTP vers HTTPS --"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "http://${{ vars.CONTENEUR_DOMAINE }}/sante")
          test "$CODE" = "301" || { echo "Redirection absente : $CODE"; exit 1; }

          echo "Deploiement verifie : $BASE"

      - name: Etat final du service
        if: always()
        run: |
          aws ecs describe-services \
            --cluster '${{ vars.ECS_CLUSTER }}' \
            --services '${{ vars.ECS_SERVICE }}' \
            --query 'services[0].deployments[].{statut:rolloutState,motif:rolloutStateReason,actives:runningCount}' \
            --output table || true

  # ==========================================================================
  # 4. DÉPLOYER SUR KUBERNETES — seulement si un cluster EKS existe
  # ==========================================================================
  deployer_eks:
    name: Deployer sur EKS
    runs-on: ubuntu-latest
    needs: publier
    if: vars.EKS_CLUSTER != '' && (github.event_name != 'workflow_dispatch' || inputs.deployer)

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: S'authentifier aupres d'AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_CONTENEURS }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-3' }}

      # Appartenir au compte AWS ne donne AUCUN droit dans Kubernetes : les deux
      # systemes d'autorisation sont distincts. C'est l'entree d'acces EKS
      # declaree en Terraform qui autorise ce role, et sur le seul espace de
      # noms « musea ».
      - name: Obtenir le kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name '${{ vars.EKS_CLUSTER }}' \
            --region '${{ vars.AWS_REGION || 'eu-west-3' }}'
          kubectl version --client

      # Version figee plutot qu'un script d'installation distant : on veut le
      # meme outil dans six mois qu'aujourd'hui.
      - name: Installer kustomize
        run: |
          set -euo pipefail
          VERSION=5.4.3
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${VERSION}/kustomize_v${VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Pointer le deploiement sur la nouvelle image
        working-directory: infra-conteneurs/kubernetes/overlays/eks
        run: |
          set -euo pipefail
          IMAGE='${{ needs.publier.outputs.image_ecr }}@${{ needs.publier.outputs.empreinte }}'

          # `kustomize edit` modifie le fichier DANS LE RUNNER, jamais dans le
          # depot : l'overlay versionne garde ses valeurs de reference.
          kustomize edit set image "musea=$IMAGE"

          # L'overlay porte un ARN a substituer (voir serviceaccount-irsa.yaml).
          # Sans lui, le pod n'obtient aucun identifiant AWS et les appels SES
          # echouent en « NoCredentialProviders ».
          ROLE='${{ vars.EKS_IRSA_ROLE_ARN }}'
          if [ -n "$ROLE" ]; then
            sed -i "s#REMPLACER_PAR_LA_SORTIE_role_irsa#${ROLE}#" serviceaccount-irsa.yaml
          else
            echo "::warning::EKS_IRSA_ROLE_ARN absente : le pod n'aura pas d'identite AWS."
            sed -i '/eks.amazonaws.com\/role-arn/d' serviceaccount-irsa.yaml
          fi

          kustomize build . > /tmp/manifeste.yaml
          echo "--- extrait du manifeste rendu ---"
          head -40 /tmp/manifeste.yaml

      - name: Appliquer
        run: |
          set -euo pipefail
          kubectl apply -f /tmp/manifeste.yaml

          # `rollout status` echoue au-dela de progressDeadlineSeconds : c'est
          # ce qui transforme un deploiement bloque en echec visible plutot
          # qu'en attente silencieuse.
          kubectl -n musea rollout status deployment/musea --timeout=5m

      - name: Etat du cluster
        if: always()
        run: |
          kubectl -n musea get pods -o wide || true
          kubectl -n musea get svc || true
          kubectl -n musea describe deployment musea | tail -25 || true

apiVersion: v1
kind: Service
metadata:
  name: musea
  namespace: musea
  labels:
    app.kubernetes.io/name: musea
spec:
  # ClusterIP dans la base : le manifeste de base ne doit RIEN exposer de
  # lui-même. C'est l'overlay qui décide comment on entre — NodePort en local,
  # répartiteur de charge sur EKS. Un base qui créerait un LoadBalancer
  # facturerait une adresse publique dès le premier essai en local.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: musea
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

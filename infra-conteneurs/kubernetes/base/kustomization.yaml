apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base commune aux deux environnements. Elle ne s'applique pas telle quelle :
# on passe toujours par un overlay, qui choisit l'image et la façon d'entrer.
#   kubectl apply -k ../overlays/local
#   kubectl apply -k ../overlays/eks

namespace: musea

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml

commonLabels:
  app.kubernetes.io/part-of: musea
  app.kubernetes.io/managed-by: kustomize

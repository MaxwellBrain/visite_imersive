apiVersion: v1
kind: ServiceAccount
metadata:
  name: musea
  namespace: musea
  labels:
    app.kubernetes.io/name: musea
# Pas de jeton d'API monté : ce frontal ne parle jamais à l'API Kubernetes.
# Monter le jeton par défaut offrirait à un attaquant, en cas de compromission
# du conteneur, un point de départ vers le reste du cluster.
automountServiceAccountToken: false

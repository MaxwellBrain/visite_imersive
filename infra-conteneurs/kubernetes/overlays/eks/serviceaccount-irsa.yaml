apiVersion: v1
kind: ServiceAccount
metadata:
  name: musea
  namespace: musea
  annotations:
    # IRSA : le pod obtient des identifiants AWS temporaires en présentant le
    # jeton de ce ServiceAccount. Aucune clé d'accès n'existe nulle part.
    # ARN à reprendre de la sortie Terraform `cluster_kubernetes.role_irsa`.
    eks.amazonaws.com/role-arn: REMPLACER_PAR_LA_SORTIE_role_irsa
# Exception assumée à la règle du base : IRSA EXIGE que le jeton soit monté —
# c'est lui que le pod échange contre des identifiants AWS. Sans cette ligne,
# l'annotation ci-dessus reste sans effet et les appels SES échouent en
# « NoCredentialProviders ».
automountServiceAccountToken: true

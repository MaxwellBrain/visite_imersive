 as=\"points\">\n              <mxPoint x=\"1260\" y=\"1110\" />\n              <mxPoint x=\"225\" y=\"1110\" />\n            </Array>\n          </mxGeometry>\n        </mxCell>\n        <mxCell id=\"note\" value=\"La clé d&#39;accès au modèle de langue ne quitte jamais la fonction serveur : le navigateur du visiteur ne dialogue qu&#39;avec guide-agent.  ·  Les fragments sont plongés en anglais : une requête française classait une œuvre sans rapport devant deux masques réellement apparentés.  ·  La recherche remonte les fragments les plus proches, que la consigne d&#39;ancrage impose au modèle : il ne peut énoncer aucun fait qui n&#39;y figure pas, et il est autorisé à déclarer qu&#39;aucune conclusion n&#39;est possible.  ·  Les questions restées sans réponse sont journalisées anonymement et classées en huit thèmes, qui indiquent quoi documenter.\" style=\"rounded=1;whiteSpace=wrap;html=1;arcSize=8;fillColor=#F4F6FA;strokeColor=#9AA0A6;fontSize=20;fontColor=#44546A;align=left;spacingLeft=12;spacingTop=6;verticalAlign=top;\" vertex=\"1\" parent=\"1\">\n          <mxGeometry x=\"80\" y=\"1180\" width=\"1310\" height=\"210\" as=\"geometry\" />\n        </mxCell>\n      </root>\n    </mxGraphModel>\n  </diagram>\n</mxfile>\n", "toolbar": null, "zoom": 1, "highlight": "#0000ff", "nav": false, "resize": false, "border": 10}'></div>

<script>
function etat(t){ document.getElementById('etat').textContent = t; }

window.addEventListener('load', function () {
  try {
    // Libelles traces en <text> et non en foreignObject.
    mxClient.NO_FO = true;
    var el = document.getElementById('cible');
    var cfg = JSON.parse(el.getAttribute('data-mxgraph'));
    var node = mxUtils.parseXml(cfg.xml).documentElement;
    el.innerHTML = '';
    var v = new GraphViewer(null, node, cfg);
    v.init(el, node);
    window.__v = v;
    setTimeout(envoyer, 1200);
    etat('rendu en cours...');
  } catch (e) { etat('ERREUR : ' + e.message); }
});

function envoyer() {
  try {
    var g = window.__v.graph;
    g.foEnabled = false;
    var svg = g.getSvg('#ffffff', 1, 12, false, null, true, null, null, null, false);
    var s = '<?xml version="1.0" encoding="UTF-8"?>\n'
          + new XMLSerializer().serializeToString(svg);
    window.__taille = s.length;
    fetch('/', { method: 'POST', body: s })
      .then(function (r) { return r.text(); })
      .then(function () { window.__fini = true; etat('OK - ' + s.length + ' octets envoyes'); })
      .catch(function (e) { etat('ERREUR envoi : ' + e.message); });
  } catch (e) { etat('ERREUR rendu : ' + e.message); }
}
</script>

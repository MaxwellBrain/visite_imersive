" pointer-events="all" style="fill: rgb(68, 84, 106); stroke: rgb(68, 84, 106);"/></g></g><g data-cell-id="q3"><g><path d="M 1021.63 922.63 L 1106.82 922.63" fill="none" stroke="#ed7d31" stroke-width="1.8" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(237, 125, 49);"/><path d="M 1114.62 922.63 L 1106.82 925.23 L 1106.82 920.03 Z" fill="#ed7d31" stroke="#ed7d31" stroke-width="1.8" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(237, 125, 49); stroke: rgb(237, 125, 49);"/></g></g><g data-cell-id="q4"><g><path d="M 896.63 852.82 L 896.63 617.44" fill="none" stroke="#2e74b5" stroke-width="1.8" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(46, 116, 181);"/><path d="M 896.63 860.62 L 894.03 852.82 L 899.23 852.82 Z" fill="#2e74b5" stroke="#2e74b5" stroke-width="1.8" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(46, 116, 181); stroke: rgb(46, 116, 181);"/><path d="M 896.63 609.64 L 899.23 617.44 L 894.03 617.44 Z" fill="#2e74b5" stroke="#2e74b5" stroke-width="1.8" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(46, 116, 181); stroke: rgb(46, 116, 181);"/></g></g><g data-cell-id="q5"><g><path d="M 1241.63 982.63 L 1241.68 1102.58 Q 1241.68 1107.58 1236.68 1107.58 L 211.59 1107.58 Q 206.59 1107.58 206.59 1102.58 L 206.63 992.44" fill="none" stroke="#44546a" stroke-width="1.8" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(68, 84, 106);"/><path d="M 206.63 984.64 L 209.23 992.44 L 204.03 992.44 Z" fill="#44546a" stroke="#44546a" stroke-width="1.8" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(68, 84, 106); stroke: rgb(68, 84, 106);"/></g><g><g transform="scale(0.9999999999999999)"><text x="724" y="1105" fill="#44546A" font-family="Helvetica" font-size="20px" text-anchor="middle" style="fill: rgb(68, 84, 106);">réponse sourcée</text></g></g></g><g data-cell-id="note"><g transform="translate(0.5,0.5)"><rect x="61.63" y="1177.63" width="1310" height="210" rx="16.8" ry="16.8" fill="#f4f6fa" stroke="#9aa0a6" pointer-events="all" style="fill: rgb(244, 246, 250); stroke: rgb(154, 160, 166);"/></g><g><g transform="scale(0.9999999999999999)"><text x="76" y="1211" fill="#44546A" font-family="Helvetica" font-size="20px" style="fill: rgb(68, 84, 106);"><tspan x="76" y="1211">La clé d'accès au modèle de langue ne quitte jamais la fonction serveur : le navigateur du visiteur ne dialogue qu'avec guide-agent. · Les</tspan><tspan x="76" y="1235">fragments sont plongés en anglais : une requête française classait une œuvre sans rapport devant deux masques réellement apparentés. · La</tspan><tspan x="76" y="1259">recherche remonte les fragments les plus proches, que la consigne d'ancrage impose au modèle : il ne peut énoncer aucun fait qui n'y figure pas,</tspan><tspan x="76" y="1283">et il est autorisé à déclarer qu'aucune conclusion n'est possible. · Les questions restées sans réponse sont journalisées anonymement et classées</tspan><tspan x="76" y="1307">en huit thèmes, qui indiquent quoi documenter.</tspan></text></g></g></g></g></g></g><g requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"/><a transform="translate(0,-5)" xlink:href="https://www.drawio.com/doc/faq/svg-export-text-problems" target="_blank"><text text-anchor="middle" font-size="10px" x="50%" y="100%">Text is not SVG - cannot display</text></a></svg>
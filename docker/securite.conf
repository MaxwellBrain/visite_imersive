# En-têtes de sécurité — mêmes valeurs que la politique CloudFront de `infra/`.
#
# POURQUOI CE FICHIER EXISTE PLUTÔT QU'UN BLOC UNIQUE AU NIVEAU DU SERVEUR
#
# `add_header` ne s'hérite PAS comme les autres directives : un bloc `location`
# qui déclare ne serait-ce qu'un seul `add_header` perd d'un coup TOUS ceux
# hérités des niveaux supérieurs. Il n'y a ni avertissement ni message d'erreur.
#
# Le cas concret ici : « / » sert index.html par `try_files`, ce qui déclenche
# une redirection interne vers `location = /index.html`. Or ce bloc pose son
# propre `add_header Cache-Control` — et la page d'accueil partait donc sans
# nosniff, sans HSTS et sans X-Frame-Options, alors que les quatre directives
# étaient bien écrites au niveau du serveur.
#
# D'où ce fichier, inclus à la fois au niveau du serveur ET dans chaque
# `location` qui déclare un `add_header`. Une seule source, aucun oubli possible.

add_header X-Content-Type-Options    "nosniff"                             always;
add_header X-Frame-Options           "DENY"                                always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Configuration nginx du site MUSÉA en production.
# Reproduit volontairement ce que fait CloudFront, pour que le comportement
# vérifié en local soit celui observé en ligne.

# Types que nginx ne connaît pas par défaut, et dont l'absence casse la
# réalité augmentée sans le moindre message d'erreur.
types {
    model/gltf-binary   glb;
    model/gltf+json     gltf;
    model/vnd.usdz+zip  usdz;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sur un sous-domaine d'organisation, l'application résout le locataire à
    # partir du nom d'hôte : celui-ci doit donc être transmis intact.
    server_name_in_redirect off;

    # Configuration produite au démarrage par docker/entrypoint.sh : portail
    # d'accès du staging, le cas échéant. Le joker ne correspond à aucun
    # fichier en production — nginx l'accepte sans broncher, et le site reste
    # public.
    include /tmp/musea/*.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # ---- En-têtes de sécurité ----
    # Dans un fichier à part, et réinclus dans CHAQUE location qui déclare son
    # propre add_header : celui-ci efface sinon tous les en-têtes hérités, en
    # silence. Voir l'explication en tête de docker/securite.conf.
    include /etc/nginx/securite.conf;

    # ---- Fichiers hachés : immuables ----
    location /assets/ {
        include /etc/nginx/securite.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- Modèles 3D : stables, mais sans hachage dans le nom ----
    location /modeles/ {
        include /etc/nginx/securite.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        # Un .glb est déjà compressé : le recompresser coûte du temps pour rien.
        gzip off;
        try_files $uri =404;
    }

    # ---- Jamais en cache ----
    # sw.js commande ce que voient les visiteurs déjà venus : mis en cache, il
    # fige le site sur une version périmée, parfois pendant des jours.
    location = /sw.js {
        include /etc/nginx/securite.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location = /index.html {
        include /etc/nginx/securite.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # ---- Sonde de sante ----
    # Route dédiée, servie sans authentification et sans toucher au disque.
    # Le répartiteur de charge et Kubernetes interrogent CELLE-CI, jamais « / » :
    # sonder la page d'accueil échouerait dès que le portail du staging est
    # actif — le répartiteur recevrait 401 et déclarerait saines zéro tâche.
    location = /sante {
        auth_basic off;
        access_log off;
        # `default_type` plutot qu'un `add_header` : poser Content-Type par
        # add_header produit un en-tete en double sur certaines versions.
        default_type text/plain;
        return 200 "ok";
    }

    # ---- REPLI SPA ----
    # Le routeur Vue gère /site/visite/3 côté navigateur ; le disque, lui, ne
    # connaît pas ce chemin. Sans cette ligne, tout lien profond échoue au
    # rafraîchissement — et les QR codes de RA pointent vers /site/ar/<id>.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

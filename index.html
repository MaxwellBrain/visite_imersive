<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Titre de la PLATEFORME, pas d'une organisation : ce fichier est servi
         pour tous les hôtes, y compris nexacode.store et chaque locataire.
         Y nommer une fondation faisait apparaître son nom dans l'onglet du
         navigateur sur le site de toutes les autres. Chaque vue pose ensuite
         son propre titre. -->
    <title>MUSÉA — la plateforme du patrimoine</title>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e6f5c" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Polices : Anton (titres display type TCHOKOS), Inter (texte), Fraunces (serif éditorial) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Toutes les donnees ET toutes les images viennent de Supabase. Sans
         cette ligne, la premiere requete paie un DNS + TLS complet avant
         d avoir commence : sur les reseaux qui nous interessent, cela se
         compte en centaines de millisecondes. Vite remplace %VITE_SUPABASE_URL%
         a la compilation. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
